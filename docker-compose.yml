services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notesdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notesdb"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: myapp:v1
    environment:
      PORT: 3050
      DATABASE_URL: postgres://notes:notes@db:5432/notesdb
    ports: ["3050:3050"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: